# ---------------------------------------------------------------------------
# Global site settings. Empty values ("") are hidden on the website.
# Items marked TO CONFIRM still need to be supplied by the consortium.
# ---------------------------------------------------------------------------
name: FireRisk
tagline: Science for fire-resilient landscapes in Flanders
description: >-
  FireRisk is an interdisciplinary research project that strengthens wildfire
  risk assessment, prevention and response in Flanders through high-resolution
  geodata, fire spread modelling, AI-based visualisation and crisis governance.

# Public URL of the production website, without trailing slash.
# Used for the sitemap and social sharing cards. TO CONFIRM
url: ""

# General project e-mail address. TO CONFIRM
# The contact form sends its messages to this address (via formsubmit.co).
# The first message sent through the form triggers a one-time activation
# e-mail to this address: click the link in it, then the form works.
email: ""

# Optional: a different endpoint for the contact form, e.g. the random
# formsubmit.co alias you get after activation (hides the e-mail address
# from spam bots), or a Formspree URL. Leave empty to use "email".
contact_form: ""

# Partner id (see partners.yaml) of the coordinating institution.
coordinator: PXL

# Funding acknowledgement shown in the footer, e.g.
# "FireRisk is funded by the Research Foundation – Flanders (FWO)." TO CONFIRM
funding: ""

# Social channels. Leave empty to hide.
social:
  linkedin: ""
  bluesky: ""
  x: ""
  youtube: ""
