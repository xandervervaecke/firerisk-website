# ---------------------------------------------------------------------------
# Consortium partners. The `id` is what work packages and team profiles use
# (e.g. `lead: PXL`). `institution` groups research units of one university.
# Expertise lines are taken from the consortium table (section 3.4) of the
# FireRisk scientific project description.
# ---------------------------------------------------------------------------
- id: PXL
  short: PXL
  name: PXL University of Applied Sciences and Arts
  institution: PXL University of Applied Sciences and Arts
  institution_short: PXL
  website: https://www.pxl.be
  role: Project coordinator
  expertise:
    - Technical WUI definition and geospatial analysis
    - Fuel characteristics and UAV-LiDAR
    - Geospatial modelling, including cellular automata
    - Operational decision-making, command post (CP-Ops) and post-incident briefings
    - Training programmes for firefighters
    - "Collaboration with end users: firefighters"

